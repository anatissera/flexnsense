name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project environment
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt

      # The joint geometry is read from NormaCore's URDF, so the kinematics tests need it.
      # Only that one directory, not the protobufs: nothing here talks to a real Station.
      - name: Fetch the ElRobot URDF
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/norma-core/norma-core.git
          git -C norma-core sparse-checkout set hardware/elrobot/simulation

      - name: Run the test suite
        run: .venv/bin/python -m pytest -q
