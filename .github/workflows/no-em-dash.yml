name: no-em-dash

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if an em dash (U+2014) is present in any tracked text file
        run: |
          if git -c core.quotepath=false grep -I -n $'\xe2\x80\x94' -- . ; then
            echo
            echo "Em dashes (—) found above. Use a period, a comma, or a plain hyphen instead."
            exit 1
          fi
          echo "No em dashes found."
