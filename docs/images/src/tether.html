<div class="head">
  <div class="kicker">How it works</div>
  <h2>At the cap, the arm moves with the finger.</h2>
  <p class="lead">The finger pulls on a spring scale held by the robot arm. A camera reads the
  scale in grams. This is <b>active</b> mode, one of two: in <b>cpm</b> the arm drives the
  whole stroke and the finger goes along.</p>
</div>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
// ?t=<ms> freezes the animation at one instant, with the trace drawn up to there, so the
// renderer can walk the cycle a frame at a time instead of racing a live clock.
const FROZEN = new URLSearchParams(location.search).get('t');
const reduce = false;
const ticks = document.getElementById('ticks');
  ticks.replaceChildren();
  for (let g = 0; g <= 600; g += 25) {
    const x = 580 + g * 0.8, long = g % 100 === 0, l = document.createElementNS(SVGNS, 'line');
    l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', long ? 292 : 296); l.setAttribute('y2', long ? 306 : 303);
    ticks.appendChild(l);
  }
  
function startTether() {
    const $ = id => document.getElementById(id);
    const marker = $('marker'), reading = $('reading'), pill = $('pillbg'), rig = $('rig'), idx = $('idx'), cr1 = $('cr1'), cr2 = $('cr2'), loop = $('loop'),
          tether = $('tether'), status = $('status'), trace = $('trace'), live = $('live');
    const CYCLE = 8000, CAP = 200, INK = '#0E141F', GREEN = '#1B9A66';
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    function state(t) {                               // -> force (g), arm travel (px), label
      if (t < 2400) { const p = ease(t / 2400); return { f: Math.min(CAP, 235 * p), y: 0, s: 'Arm holds' }; }
      if (t < 4800) { const p = (t - 2400) / 2400; return { f: CAP + Math.sin(p * Math.PI * 6) * 2, y: -46 * ease(p), s: 'Holding 200 g: the arm follows' }; }
      if (t < 6200) { const p = ease((t - 4800) / 1400); return { f: CAP * (1 - p), y: -46 * (1 - p), s: 'Finger relaxes' }; }
      return { f: 0, y: 0, s: 'Arm holds' };
    }
    let raf, t0 = performance.now(), pts = [], last = 0;
    function draw(t, now) {
      const { f, y, s } = state(t), capped = f >= CAP - 3;
      marker.setAttribute('x', 563 + f * 0.8);
      rig.setAttribute('transform', `translate(${y} 0)`);
      // Seen from above, a curling finger looks shorter: the far joints shorten the most.
      const c = 0.18 * (f / CAP) + 0.5 * (-y / 46);
      const j1 = 226 + 76 * (1 - 0.25 * c), j2 = j1 + 62 * (1 - 0.55 * c), tip = j2 + 52 * (1 - 0.75 * c);
      idx.setAttribute('width', tip - 195);
      cr1.setAttribute('x1', j1); cr1.setAttribute('x2', j1); cr2.setAttribute('x1', j2); cr2.setAttribute('x2', j2);
      loop.setAttribute('x', tip - 52);
      tether.setAttribute('x1', tip + 18); tether.setAttribute('x2', 466 + y);
      reading.textContent = Math.round(f) + ' g';
      const col = capped ? GREEN : INK;
      reading.setAttribute('fill', col); pill.setAttribute('stroke', col);
      status.textContent = s; status.setAttribute('fill', col);
      live.setAttribute('opacity', 0.35 + 0.65 * Math.abs(Math.sin(now / 500)));
      pts.push((60 + 1050 * t / CYCLE).toFixed(1) + ',' + (555 - f * 0.3).toFixed(1));
      trace.setAttribute('points', pts.join(' '));
    }
    // Replays the cycle from zero up to one instant, so the renderer can step the
    // animation deterministically instead of screenshotting a live clock.
    window.__drawUpTo = T => { pts = []; for (let u = 0; u <= T; u += 33) draw(u, u); };
    if (reduce) { for (let t = 0; t <= 3600; t += 40) draw(t, 0); return; }
    const frame = now => {
      const t = (now - t0) % CYCLE;
      if (t < last) pts = [];                         // new cycle: clear the trace
      last = t;
      draw(t, now);
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }
if (FROZEN === null) {
  startTether();
} else {
  // startTether installs the draw loop and returns its canceller; run it, stop it, then
  // replay the cycle up to the requested instant using the same draw() it just used.
  window.__frame = null;
  const stop = startTether();
  stop();
  const target = Math.max(0, Math.min(8000, +FROZEN));
  window.__drawUpTo(target);
}
</script>
