<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">How the gauge reader turns the scale into grams</title>
  <desc id="d">Two red dots are drawn on the scale tube and the red marker slides between them. Each frame, the camera finds the three red spots, measures where the marker sits between the dots as a fraction, and converts the fraction into grams. Moving, turning or zooming the scale changes the pixels but not the fraction.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .h { font-size: 20px; font-weight: 700; }
    .m { font-size: 12px; fill: #52606d; }
    .b { font-size: 13px; font-weight: 600; }
    .tick { stroke: #7b8794; stroke-width: 1.5; }
    .red { fill: #e12d39; }
    .dim { stroke: #2186eb; stroke-width: 2; fill: none; }
    .step { fill: #f5f7fa; stroke: #cbd2d9; stroke-width: 1.5; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2186eb"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker></defs>
  <rect x="1" y="1" width="958" height="358" rx="16" fill="#ffffff" stroke="#e4e7eb" stroke-width="2"/>
  <text class="h" x="40" y="44">Gauge reader: the marker's place between two red dots is the weight</text>

  <rect x="80" y="86" width="800" height="44" rx="22" fill="#d9dee3" stroke="#9aa5b1" stroke-width="2"/>
  <g class="tick"><path d="M180,96 v14"/><path d="M230,96 v8"/><path d="M280,96 v14"/><path d="M330,96 v8"/><path d="M380,96 v14"/><path d="M430,96 v8"/><path d="M480,96 v14"/><path d="M530,96 v8"/><path d="M580,96 v14"/><path d="M630,96 v8"/><path d="M680,96 v14"/><path d="M730,96 v8"/><path d="M780,96 v14"/></g>
  <text class="m" x="180" y="124" text-anchor="middle">0</text><text class="m" x="780" y="124" text-anchor="middle">600</text>
  <circle class="red" cx="130" cy="108" r="9"/><text class="b" x="130" y="76" text-anchor="middle">dot 1</text>
  <rect class="red" x="466" y="99" width="26" height="18" rx="6"/><text class="b" x="479" y="76" text-anchor="middle">marker</text>
  <circle class="red" cx="830" cy="108" r="9"/><text class="b" x="830" y="76" text-anchor="middle">dot 2</text>
  <path class="dim" d="M130,150 H476" marker-end="url(#a)"/>
  <path d="M130,170 H830" stroke="#9aa5b1" stroke-width="2" marker-end="url(#g)"/>
  <text class="b" x="500" y="156" style="fill:#2186eb">u = marker ÷ dots = 0.50</text>
  <text class="m" x="500" y="196">the same when the scale moves, turns or comes closer</text>

  <rect class="step" x="40" y="206" width="200" height="118" rx="12"/>
  <text class="b" x="56" y="232">1 · Find red spots</text>
  <text class="m" x="56" y="254">every frame, by colour</text>
  <text class="m" x="56" y="272">skin and other red</text>
  <text class="m" x="56" y="290">objects are dropped</text>
  <rect class="step" x="264" y="206" width="200" height="118" rx="12"/>
  <text class="b" x="280" y="232">2 · Three in a row</text>
  <text class="m" x="280" y="254">outer two = the dots</text>
  <text class="m" x="280" y="272">middle one = the marker</text>
  <text class="m" x="280" y="290">a covered dot: no reading</text>
  <rect class="step" x="488" y="206" width="200" height="118" rx="12"/>
  <text class="b" x="504" y="232">3 · The fraction u</text>
  <text class="m" x="504" y="254">where the marker sits</text>
  <text class="m" x="504" y="272">between the dots, 0 to 1,</text>
  <text class="m" x="504" y="290">to a fraction of a pixel</text>
  <rect class="step" x="712" y="206" width="208" height="118" rx="12" style="fill:#e3f9e5;stroke:#3ebd93"/>
  <text class="b" x="728" y="232">4 · Grams</text>
  <text class="m" x="728" y="254">calibration: 0 g and 600 g</text>
  <text class="m" x="728" y="272">lines as fractions, zeroed</text>
  <text class="m" x="728" y="290">then smoothed (Kalman)</text>
  <text class="b" x="728" y="312" style="fill:#0e7c58">→ 300 g · steady</text>
</svg>
