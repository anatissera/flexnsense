<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Force capped at the clinician's threshold</title>
  <desc id="d">Force on the finger over time. It rises while the finger moves, flattens at the 200 g threshold while arm B yields, and returns to zero when the finger relaxes. A rigid anchor would have kept the force rising.</desc>
