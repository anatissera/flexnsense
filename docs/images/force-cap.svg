    .b { font-size: 13px; font-weight: 600; }
    .ax { stroke: #9aa5b1; stroke-width: 1.5; }
    .tk { stroke: #9aa5b1; stroke-width: 1.5; }
  </style>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#ffffff" stroke="#e4e7eb" stroke-width="2"/>
  <text class="h" x="80" y="40">The force on the finger never passes the cap</text>
  <rect x="408.0" y="60" width="246.0" height="210" fill="#e3f9e5"/>
  <text class="b" x="418.0" y="80" style="fill:#0e7c58">arm B yields</text>
  <path class="ax" d="M80,270 H900 M80,270 V56"/>
  <path class="tk" d="M80,270 v6"/><text class="m" x="80" y="292" text-anchor="middle">0</text><path class="tk" d="M244,270 v6"/><text class="m" x="244" y="292" text-anchor="middle">2</text><path class="tk" d="M408,270 v6"/><text class="m" x="408" y="292" text-anchor="middle">4</text><path class="tk" d="M572,270 v6"/><text class="m" x="572" y="292" text-anchor="middle">6</text><path class="tk" d="M736,270 v6"/><text class="m" x="736" y="292" text-anchor="middle">8</text><path class="tk" d="M900,270 v6"/><text class="m" x="900" y="292" text-anchor="middle">10</text><path class="tk" d="M74,270.0 h6"/><text class="m" x="68" y="274.0" text-anchor="end">0</text><path class="tk" d="M74,203.3 h6"/><text class="m" x="68" y="207.3" text-anchor="end">100</text><path class="tk" d="M74,136.7 h6"/><text class="m" x="68" y="140.7" text-anchor="end">200</text><path class="tk" d="M74,70.0 h6"/><text class="m" x="68" y="74.0" text-anchor="end">300</text>
  <text class="m" x="900" y="314" text-anchor="end">time (s)</text>
