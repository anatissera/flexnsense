<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168" width="640" height="168" role="img" aria-labelledby="t">
  <title id="t">Flex'N Sense</title>
  <!-- Same brand as the pitch deck (docs/pitch-v4-storytelling): the mark is a finger, or a gauge needle,
       sweeping to the limit where the red marker sits, and the red marker is the wordmark's apostrophe.
       The paper card keeps the dark ink readable on GitHub's dark theme. -->
  <style>
    .wm { font-family: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 68px; letter-spacing: -2px; fill: #0E141F; }
  </style>
  <rect width="640" height="168" rx="26" fill="#F4F7FB"/>
  <g transform="translate(30,22) scale(1.94)">
    <g fill="none" stroke="#0E141F" stroke-width="9" stroke-linecap="round">
      <path d="M10 46 L10 16" opacity=".16"/>
      <path d="M10 46 L25 20.02" opacity=".34"/>
      <path d="M10 46 L35.98 31" opacity=".6"/>
      <path d="M10 46 L40 46"/>
    </g>
    <circle cx="53" cy="46" r="6" fill="#E63B2E"/>
    <circle cx="10" cy="46" r="2.5" fill="#F4F7FB"/>
  </g>
  <text class="wm" x="330" y="109" text-anchor="end">Flex</text>
  <rect x="335" y="58" width="9" height="21" rx="4.5" fill="#E63B2E" transform="rotate(14 339.5 68.5)"/>
  <text class="wm" x="350" y="109">N Sense</text>
</svg>
