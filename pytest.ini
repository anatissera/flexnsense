[pytest]
# Collect our tests only. The setup instructions clone two third-party repos into the
# repository root (`norma-core/`, for the Station client and protobufs, and `lerobot/`), both
# git-ignored, and both ship their own test suites. Without this, `python -m pytest` from the
# root tries to collect those too and fails at import time on their dev dependencies, which
# looks like our tests breaking when nothing of ours has changed.
testpaths = tests
norecursedirs = norma-core lerobot dashboard .venv recordings internal-docs .git
